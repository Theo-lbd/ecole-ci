version: 2.1

jobs:
  build:
    docker:
      - image: cimg/python:3.12
    steps:
      - checkout

      - run:
          name: Installation des dépendances
          command: |
            python -m pip install --upgrade pip
            pip install -r requirements.txt

      - run:
          name: Définir PYTHONPATH
          command: |
            echo 'export PYTHONPATH=$PYTHONPATH:$(pwd)' >> $BASH_ENV
            source $BASH_ENV

      - run:
          name: Vérification du style avec flake8
          command: |
            flake8 .

      - run:
          name: Lancement des tests avec pytest
          command: |
            pytest tests/
